<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cartón SIS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #fffdf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.25rem 1rem 2rem; gap: .875rem; }
  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:1rem; text-align:center; }
  .loading-sis { font-size:40px; font-weight:900; color:#D85A30; letter-spacing:8px; }
  .loading-sub { font-size:13px; color:#999; }
  .spinner { width:32px; height:32px; border:3px solid #eee; border-top-color:#1D4E1A; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .card-wrap { display:none; flex-direction:column; align-items:center; gap:.875rem; width:100%; max-width:360px; }
  .card-wrap.visible { display:flex; }

  .status-bar { background:#fff; border-radius:10px; padding:7px 16px; font-size:12px; color:#888; border:1px solid #eee; display:flex; align-items:center; gap:8px; width:100%; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:#ccc; flex-shrink:0; }
  .status-dot.ok { background:#1D4E1A; animation:blink 2s ease infinite; }
  .status-dot.err { background:#D85A30; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  .last-num-bar { background:#fff; border:1.5px solid #D4A843; border-radius:12px; padding:10px 20px; text-align:center; width:100%; display:none; }
  .last-num-bar.visible { display:block; }
  .last-num-label { font-size:10px; color:#aaa; text-transform:uppercase; letter-spacing:.06em; }
  .last-num-val { font-size:36px; font-weight:900; color:#D85A30; line-height:1.1; }
  .last-num-frase { font-size:11px; color:#888; margin-top:2px; line-height:1.4; }

  .card { background:#fff; border:2.5px solid #D4A843; border-radius:16px; padding:16px; width:100%; position:relative; overflow:hidden; }
  .card-bg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:160px; font-weight:900; color:#1D4E1A; opacity:.04; pointer-events:none; letter-spacing:-10px; }
  .card-top { display:flex; justify-content:center; gap:6px; margin-bottom:12px; position:relative; z-index:1; }
  .s-ltr, .i-ltr { font-size:44px; font-weight:900; color:#D85A30; font-family:'Arial Rounded MT Bold',Arial,sans-serif; text-shadow:2px 2px 0 #D4A843,-1px 0 0 #D4A843,0 -1px 0 #D4A843; line-height:1; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:6px; position:relative; z-index:1; }
  .cell { height:68px; border:1.5px solid #D4A843; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; color:#111; background:#fffdf5; cursor:pointer; user-select:none; position:relative; transition:background .12s, transform .1s; -webkit-tap-highlight-color:transparent; }
  .cell:active { transform:scale(.93); }
  .cell.available { background:#fff8e0; }
  .cell.marked { background:#1D4E1A; border-color:#1D4E1A; }
  .cell.marked .num { opacity:0; }
  .cell.marked::after { content:'✓'; position:absolute; font-size:28px; font-weight:900; color:#fff; }
  .cell.nueva { animation:pulso .7s ease; }
  @keyframes pulso { 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .num { transition:opacity .15s; }

  .card-footer { margin-top:10px; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
  .footer-sub { font-size:9px; color:#bbb; letter-spacing:.04em; }
  .footer-score { font-size:12px; font-weight:700; color:#1D4E1A; }
  .shout { display:none; text-align:center; font-size:28px; font-weight:900; color:#D85A30; letter-spacing:8px; margin-top:4px; animation:pop .5s ease; position:relative; z-index:1; }
  .shout.on { display:block; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

  .carton-badge { font-size:11px; color:#aaa; text-align:center; }
  .carton-badge strong { color:#1D4E1A; }

  .nums-sorteados { width:100%; background:#fff; border-radius:12px; padding:.75rem; border:1px solid #eee; }
  .nums-title { font-size:10px; font-weight:700; color:#bbb; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .nums-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
  .np { aspect-ratio:1; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; background:#f0f0f0; color:#ccc; }
  .np.out { background:#EEEDFE; color:#3C3489; }
  .np.last { background:#D85A30; color:#fff; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-sis">SIS</div>
  <div class="spinner"></div>
  <div class="loading-sub">Cargando tu cartón...</div>
</div>

<div class="card-wrap" id="card-wrap">
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Conectando...</span>
  </div>

  <div class="last-num-bar" id="last-num-bar">
    <div class="last-num-label">Último número sorteado</div>
    <div class="last-num-val" id="last-num-val">—</div>
    <div class="last-num-frase" id="last-num-frase"></div>
  </div>

  <div class="card">
    <div class="card-bg">SIS</div>
    <div class="card-top">
      <span class="s-ltr">S</span>
      <span class="i-ltr">I</span>
      <span class="s-ltr">S</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="card-footer">
      <div class="footer-sub">Semillero de Ingeniería y Sociedad</div>
      <div class="footer-score" id="score">0/12</div>
    </div>
    <div class="shout" id="shout">S I S !</div>
  </div>

  <div class="carton-badge" id="carton-badge"></div>

  <div class="nums-sorteados">
    <div class="nums-title">Números sorteados</div>
    <div class="nums-grid" id="nums-grid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nlaxdfsewneudvrpqfqv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sYXhkZnNld25ldWR2cnBxZnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMjMzMjAsImV4cCI6MjA5Njc5OTMyMH0.pgWPxNlloGxM04SAfB7mkuid_Rk3VgPbYSGPC0GDIHs';
const GAME_ID = 'sis-2026-1';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const FRASES = [
  "Siempre aporta ideas nuevas en las reuniones",
  "Explica los temas difíciles con mucha claridad",
  "Nunca deja a un compañero sin respuesta",
  "Su energía anima al grupo cuando hay estrés",
  "Tiene una disciplina de trabajo admirable",
  "Siempre llega puntual a las reuniones",
  "Sus presentaciones son claras y bien organizadas",
  "Aprendió algo nuevo y lo compartió con todos",
  "Es el primero en ofrecer ayuda cuando alguien necesita",
  "Tiene una curiosidad que contagia al resto del grupo",
  "Mantuvo la calma en los momentos más caóticos",
  "Su sentido del humor alegra las reuniones largas",
  "Entregó algo de gran calidad este semestre",
  "Escucha con atención antes de responder",
  "Propuso una solución que nadie más había pensado",
  "Creció visiblemente como investigador/a este semestre",
  "Siempre da retroalimentación constructiva",
  "Se adaptó bien a los cambios de plan",
  "Motivó al grupo en un momento difícil",
  "Tiene una capacidad especial para encontrar los errores",
  "Su dedicación es un ejemplo para el semillero",
  "Conecta ideas de distintas áreas con facilidad",
  "Fue clave en al menos un logro del semestre",
  "Termina lo que empieza, sin importar los obstáculos"
];

const params = new URLSearchParams(window.location.search);
const cartonId = String(parseInt(params.get('id')) || 1);

let myNums = [];
let sorteados = [];
let tapped = {};

function setStatus(ok,msg){
  document.getElementById('status-dot').className='status-dot '+(ok?'ok':'err');
  document.getElementById('status-text').textContent=msg;
}

async function init(){
  try {
    const { data, error } = await db.from('sis_juego').select('*').eq('id',GAME_ID).single();
    if(error || !data) throw new Error('El animador aún no ha iniciado la ruleta. Espera un momento y recarga.');

    const cartones = data.cartones;
    myNums = cartones[cartonId] || [];
    if(!myNums.length) throw new Error('Cartón #'+cartonId+' no encontrado. Verifica el link.');

    sorteados = data.numeros_sorteados || [];

    document.getElementById('loading').style.display='none';
    document.getElementById('card-wrap').className='card-wrap visible';
    document.getElementById('carton-badge').innerHTML='Cartón <strong>#'+cartonId+'</strong> de 14';

    renderCard();
    renderNums();
    updateLastNum();
    setStatus(true,'Conectado — esperando sorteo');
    subscribeRealtime();
    trackPresence();
  } catch(e){
    document.getElementById('loading').innerHTML=
      '<div class="loading-sis">SIS</div><div style="color:#D85A30;font-size:14px;max-width:280px;text-align:center;margin-top:8px;">'+e.message+'</div>';
  }
}

function subscribeRealtime(){
  db.channel('sis-realtime-'+GAME_ID)
    .on('postgres_changes',{
      event:'UPDATE',
      schema:'public',
      table:'sis_juego',
      filter:'id=eq.'+GAME_ID
    }, payload => {
      const nuevos = (payload.new.numeros_sorteados || []).filter(n => !sorteados.includes(n));
      sorteados = payload.new.numeros_sorteados || [];
      nuevos.forEach(n => animarSiMio(n));
      updateLastNum();
      renderNums();
      renderCard();
    })
    .subscribe(status => {
      if(status==='SUBSCRIBED') setStatus(true,'En vivo — esperando sorteo');
      if(status==='CLOSED'||status==='CHANNEL_ERROR') setStatus(false,'Desconectado — recarga la página');
    });
}

function trackPresence(){
  const ch = db.channel('sis-presence');
  ch.subscribe(async status => {
    if(status==='SUBSCRIBED'){
      await ch.track({ carton_id: parseInt(cartonId) });
    }
  });
}

function animarSiMio(num){
  if(!myNums.includes(num)) return;
  setTimeout(()=>{
    const cells = document.querySelectorAll('.cell');
    cells.forEach(c => {
      if(parseInt(c.dataset.num)===num){
        c.classList.add('nueva');
        setTimeout(()=>c.classList.remove('nueva'),800);
      }
    });
  }, 100);
}

function updateLastNum(){
  const last = sorteados[sorteados.length-1];
  const bar = document.getElementById('last-num-bar');
  if(!last){ bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  document.getElementById('last-num-val').textContent = last;
  document.getElementById('last-num-frase').textContent = FRASES[last-1];
}

function tap(num){
  if(!sorteados.includes(num)) return;
  tapped[num] = !tapped[num];
  renderCard();
}

function renderCard(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  myNums.forEach(n=>{
    const c=document.createElement('div');
    c.className='cell';
    c.dataset.num=n;
    if(sorteados.includes(n)) c.classList.add('available');
    if(tapped[n]) c.classList.add('marked');
    c.innerHTML='<span class="num">'+n+'</span>';
    c.onclick=()=>tap(n);
    grid.appendChild(c);
  });
  const count=Object.values(tapped).filter(Boolean).length;
  document.getElementById('score').textContent=count+'/12';
  document.getElementById('shout').className='shout'+(count===12?' on':'');
}

function renderNums(){
  const grid=document.getElementById('nums-grid');
  const last=sorteados[sorteados.length-1];
  grid.innerHTML='';
  for(let i=1;i<=24;i++){
    const d=document.createElement('div');
    d.className='np'+(i===last?' last':sorteados.includes(i)?' out':'');
    d.textContent=i; grid.appendChild(d);
  }
}

init();
</script>
</body>
</html>
